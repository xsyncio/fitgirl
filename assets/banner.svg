<svg width="800" height="200" viewBox="0 0 800 200"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ff00cc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3333ff;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#0d1117" rx="10" />

    <!-- Grid Pattern Overlay -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" opacity="0.5" />

    <!-- Animated Styles -->
    <style>
    @keyframes pulse {
      0% { opacity: 0.8; filter: drop-shadow(0 0 5px #ff00cc); }
      50% { opacity: 1; filter: drop-shadow(0 0 15px #ff00cc); }
      100% { opacity: 0.8; filter: drop-shadow(0 0 5px #ff00cc); }
    }
    @keyframes subPulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    .main-text {
      font-family: 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 80px;
      fill: url(#neonGradient);
      animation: pulse 3s infinite;
    }
    .sub-text {
      font-family: 'Consolas', monospace;
      font-weight: 400;
      font-size: 20px;
      fill: #a2d2ff;
      animation: subPulse 4s infinite;
      letter-spacing: 5px;
    }
    .icon {
      fill: #fff;
      opacity: 0.2;
    }
    </style>

    <!-- Main Content -->
    <text x="50%" y="55%" text-anchor="middle" class="main-text">FITGIRL</text>
    <text x="50%" y="80%" text-anchor="middle" class="sub-text">ASYNC • TYPED • SCRAPER</text>

    <!-- Decorative Elements -->
    <circle cx="50" cy="50" r="2" fill="#fff" opacity="0.5" />
    <circle cx="750" cy="150" r="2" fill="#fff" opacity="0.5" />
    <circle cx="100" cy="150" r="1.5" fill="#fff" opacity="0.3" />
    <circle cx="700" cy="50" r="1.5" fill="#fff" opacity="0.3" />

</svg>
